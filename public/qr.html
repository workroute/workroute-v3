<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkRoute QR code</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My QR">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root { --ink:#14171C; --amber:#F2A900; --amber-dark:#D69400; --steel:#3B5166; --paper:#FAF9F6; --line:#E4E1DA; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#FFFFFF; color:var(--ink);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:420px; margin:0 auto; padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:16px; min-height:100dvh; }
  h1 { margin:8px 0 0; font-size:22px; font-weight:700; letter-spacing:-0.01em; }
  .sub { margin:0; color:var(--steel); font-size:15px; }
  .qr { width:100%; max-width:340px; aspect-ratio:1; background:#FFF; border:1px solid var(--line);
    border-radius:16px; padding:12px; }
  .qr img { width:100%; height:100%; display:block; image-rendering:pixelated; }
  .url { font-size:18px; font-weight:600; margin:0; }
  .actions { width:100%; display:grid; gap:10px; margin-top:4px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  a.btn, button.btn { appearance:none; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    font:inherit; font-size:16px; font-weight:600; padding:14px 12px; border-radius:12px; text-align:center;
    text-decoration:none; cursor:pointer; min-height:52px; }
  .btn.primary { background:var(--amber); border-color:var(--amber); }
  .btn.primary:active { background:var(--amber-dark); }
  .btn:active { transform:translateY(1px); }
  .toast { min-height:20px; font-size:14px; color:#4C7A51; margin:0; }
  .hint { font-size:13px; color:#6B7280; text-align:center; margin:auto 0 0; line-height:1.4; }
</style>
</head>
<body>
<main>
  <h1>WorkRoute</h1>
  <p class="sub">Scan to visit our website</p>

  <div class="qr"><img src="/qr/workroute-qr.svg" alt="QR code for workroute.com.au"></div>
  <p class="url">workroute.com.au</p>

  <div class="actions">
    <button class="btn primary" id="shareLink" type="button">Share link</button>
    <button class="btn" id="shareQr" type="button">Share QR picture</button>
    <div class="row">
      <a class="btn" id="sms" href="#">Text</a>
      <a class="btn" id="email" href="#">Email</a>
    </div>
    <button class="btn" id="copy" type="button">Copy link</button>
    <button class="btn" id="shareContact" type="button">Send my contact card</button>
  </div>
  <p class="toast" id="toast" role="status"></p>

  <p class="hint">Tip: add this page to your phone's home screen so your QR code is one tap away.<br>
    iPhone: Share &rarr; Add to Home Screen. Android: &#8942; menu &rarr; Add to Home screen.</p>
</main>

<script>
  var URL_TO_SHARE = "https://workroute.com.au";
  var MESSAGE = "Check out WorkRoute: " + URL_TO_SHARE;
  var toast = document.getElementById("toast");
  function say(t) { toast.textContent = t; setTimeout(function () { if (toast.textContent === t) toast.textContent = ""; }, 3000); }

  // "Text" and "Email" open the phone's own apps with the link filled in.
  // iOS uses "sms:&body=", Android uses "sms:?body=".
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  document.getElementById("sms").href = "sms:" + (isIOS ? "&" : "?") + "body=" + encodeURIComponent(MESSAGE);
  document.getElementById("email").href = "mailto:?subject=" + encodeURIComponent("WorkRoute") +
    "&body=" + encodeURIComponent(MESSAGE);

  document.getElementById("shareLink").addEventListener("click", function () {
    if (navigator.share) {
      navigator.share({ title: "WorkRoute", text: "Check out WorkRoute", url: URL_TO_SHARE }).catch(function () {});
    } else {
      copyLink();
    }
  });

  document.getElementById("shareQr").addEventListener("click", function () {
    fetch("/qr/workroute-qr.png").then(function (r) { return r.blob(); }).then(function (blob) {
      var file = new File([blob], "workroute-qr.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: "WorkRoute QR code", text: MESSAGE }).catch(function () {});
      }
      // No file sharing on this device: open the picture so it can be saved.
      window.location.href = "/qr/workroute-qr.png";
    });
  });

  function copyLink() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(URL_TO_SHARE).then(function () { say("Link copied"); }, function () { say(URL_TO_SHARE); });
    } else {
      say(URL_TO_SHARE);
    }
  }
  document.getElementById("copy").addEventListener("click", copyLink);

  // Sends a link to the contact card. Tapping it on their phone offers
  // "Add to contacts" with name, mobile and email filled in.
  var CONTACT_URL = "https://app.workroute.com.au/steve.vcf";
  document.getElementById("shareContact").addEventListener("click", function () {
    var text = "Steve Pfister, WorkRoute. Tap to save my contact details:";
    if (navigator.share) {
      navigator.share({ title: "Steve Pfister - WorkRoute", text: text, url: CONTACT_URL }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(CONTACT_URL).then(function () { say("Contact link copied"); });
    } else {
      say(CONTACT_URL);
    }
  });
</script>
</body>
</html>
