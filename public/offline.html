<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#021f59" />
<title>WorkRoute — offline</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #021f59;
    color: #faf9f6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
  }
  .pin {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 20px;
    color: rgba(250, 249, 246, 0.75);
    font-size: 14px;
    line-height: 1.5;
  }
  button {
    font: inherit;
    font-weight: 600;
    background: #f2a900;
    color: #14171c;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:hover {
    background: #d69400;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="pin" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10c-16 0-28 12-28 28 0 20 28 52 28 52s28-32 28-52c0-16-12-28-28-28z" stroke="#29ABE2" stroke-width="6"/>
      <circle cx="50" cy="38" r="12" fill="#ffffff"/>
    </svg>
    <h1>You're offline</h1>
    <p>Can't reach WorkRoute right now — check your connection. Anything you already had open should still be there once you're back in range.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
